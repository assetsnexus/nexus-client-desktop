appId: org.assetsnexus.nexus-desktop
productName: Nexus
copyright: Copyright © AssetsNexus

directories:
  output: release
  buildResources: build

files:
  - dist-electron/**/*
  - dist/renderer/**/*
  - dist-native/**/*
  - package.json

# Electron is bundled by electron-builder; @nexus/node-core and its
# @nexus/commands-client dep are already inlined into dist-electron by esbuild.
asar: true

# The native helper must live outside the asar archive to be executable.
asarUnpack:
  - dist-native/**

# The window/taskbar icon is read from disk at runtime, so it must sit outside
# the asar next to the app bundle (see resolveWindowIcon in src/main/main.ts).
# electron-builder derives the installer/.ico/.icns from build/icon.png.
extraResources:
  - from: build/window-icon.png
    to: window-icon.png
  # The faster-whisper server script the GPU STT engine spawns. It is a plain
  # Python file (not compiled), so it ships next to the app bundle where
  # `createGpuSttEngine` looks for it (`resources/local-voice/`).
  - from: ../../packages/local-voice/python
    to: local-voice

# Auto-update channel metadata; a real update server is a later layer.
publish:
  provider: github
  releaseType: draft

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Signing/notarization need an Apple Developer membership; unsigned builds
  # run after a right-click Open. Decide before the first public release.
  identity: null

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  category: Network
  executableName: nexus-desktop
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64]
  desktop:
    Name: Nexus
    Comment: Nexus desktop client

deb:
  packageName: nexus-desktop

# A hosted GPG-signed apt repo is a later layer; the .deb/.rpm artifacts ship first.
